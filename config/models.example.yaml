# TARGET CONFIG FORMAT — NOT PARSED BY THE CURRENT GO STARTER.
# Model IDs/capabilities are placeholders to show relationships; confirm actual
# model availability and limits before creating active deployments.
models:
  - id: example/open-model
    label: Example open-weight text model
    capabilities:
      text: true
      tools: false
      vision: false
      structured_json: false
    context_tokens: null
    max_output_tokens: null

deployments:
  - id: example-openmodel-at-provider-a
    model_id: example/open-model
    provider: example-a
    upstream_model_id: vendor-specific-model-id
    enabled: false
  - id: example-openmodel-at-provider-b
    model_id: example/open-model
    provider: example-b
    upstream_model_id: alternative-vendor-id
    enabled: false

virtual_models:
  - id: router/eco
    policy: lowest_estimated_cost
  - id: router/fast
    policy: healthy_lowest_p95_ttft
  - id: router/auto
    policy: weighted_cost_latency_reliability
